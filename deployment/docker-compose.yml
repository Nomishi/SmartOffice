# Hạ tầng dùng chung: Mosquitto + PostgreSQL + Backend + Frontend.
# Chạy:  Copy-Item ../.env.example .env  (đổi mật khẩu)  rồi  docker compose --profile ui up -d --build
name: iot-office

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: iot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      MQTT_USERS: ${MQTT_USERS:?Thiếu MQTT_USERS trong .env}
    entrypoint: ["/bin/sh", "/mosquitto/entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883 || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong .env}
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
    ports:
      - "5432:5432" # chỉ dev; bỏ khi triển khai thật
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Thiết bị giả Node A + B. Chạy: docker compose --profile mock up -d mock-publisher
  mock-publisher:
    profiles: ["mock"]
    image: python:3.12-slim
    container_name: iot-mock-publisher
    working_dir: /app
    environment:
      MQTT_USERS: ${MQTT_USERS:?Thiếu MQTT_USERS trong .env}
      MQTT_HOST: mosquitto
    volumes:
      - ../tests/mqtt:/app:ro
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python mock_publisher.py"
    depends_on:
      mosquitto:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: iot-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_CLIENT_ID: smartoffice-backend
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${BACKEND_MQTT_PASSWORD:?Thiếu BACKEND_MQTT_PASSWORD trong .env}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env (≥ 32 ký tự)}
      SEED_DEV_USERS: ${SEED_DEV_USERS:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminPassword123!}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operatorPassword123!}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-viewerPassword123!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
    ports:
      - "8080:8080" # dev: Swagger/API trực tiếp
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_healthy }

  frontend:
    profiles: ["ui"]
    build:
      context: ../frontend
      args:
        VITE_USE_MOCK: ${FRONTEND_USE_MOCK:-false}
    container_name: iot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend: { condition: service_healthy }

volumes:
  mosquitto-data:
  pgdata:
