# Cấu hình Mosquitto cho môi trường DEV.
# Production/M4 sẽ bật authentication + ACL (xem contract mục 11).

listener 1883 0.0.0.0
protocol mqtt

# WebSocket cho frontend nếu M4 muốn nối trực tiếp MQTT (tùy chọn)
listener 9001 0.0.0.0
protocol websockets

# DEV: cho phép anonymous để M1/M2/M3/M4 test nhanh.
# TODO(M4): allow_anonymous false + password_file + acl_file trước khi demo.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Giữ bản tin retained (status, config) sau khi broker restart
autosave_interval 60
