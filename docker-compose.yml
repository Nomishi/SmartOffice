services:
  postgres:
    image: postgres:16-alpine
    container_name: smartoffice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartoffice}
      POSTGRES_USER: ${POSTGRES_USER:-smartoffice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartoffice}
    ports:
      # Dùng 5433 ở host để tránh đụng Postgres local đang chạy 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartoffice} -d ${POSTGRES_DB:-smartoffice}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartoffice-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
