# Cấu hình Mosquitto cho hệ thống phòng làm việc thông minh.
# Mọi thiết bị và backend đều phải đăng nhập; quyền theo topic nằm ở acl.conf.

listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
# entrypoint.sh sao chép /mosquitto/config/acl.conf sang đây với đúng chủ sở hữu và quyền
acl_file /mosquitto/auth/acl.conf

# Giữ retained message (status, config) qua các lần khởi động lại broker
persistence true
persistence_location /mosquitto/data/

# Payload của hệ thống rất nhỏ, giới hạn kích thước gói tin để chống gửi bản tin quá lớn
max_packet_size 65536

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# --- TLS (cổng 8883): bật khi có chứng chỉ, nhớ cho ESP32 nạp CA tương ứng ---
# listener 8883
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
