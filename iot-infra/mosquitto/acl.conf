# ACL Mosquitto – theo Contract mục 4 (topic) và mục 11 (bảo mật).
# Mặc định TỪ CHỐI mọi thứ không được liệt kê ở đây.

# --- Thiết bị: username = deviceId, chỉ đụng tới topic của chính mình ---
# %u là username đang đăng nhập, nên thêm thiết bị mới KHÔNG cần sửa file này.
pattern write office/%u/telemetry
pattern write office/%u/status
pattern write office/%u/ack
pattern read  office/%u/command
pattern read  office/%u/config

# --- Backend (Spring Boot): đọc dữ liệu từ mọi thiết bị, gửi lệnh/cấu hình xuống ---
user backend
topic read  office/+/telemetry
topic read  office/+/status
topic read  office/+/ack
topic write office/+/command
topic write office/+/config
