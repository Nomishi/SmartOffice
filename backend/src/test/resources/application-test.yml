spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

smartoffice:
  mqtt:
    enabled: false
  security:
    jwt-secret: test-super-secret-dev-jwt-key-minimum-256-bits-length-required!
    seed-dev-users: true
  rules:
    offline-check-interval-ms: 600000
    command-timeout-check-interval-ms: 600000
    automation-check-interval-ms: 600000

logging:
  level:
    com.smartoffice: INFO
