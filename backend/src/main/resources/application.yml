spring:
  application:
    name: smartoffice-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/smartoffice}
    username: ${DB_USER:smartoffice}
    password: ${DB_PASSWORD:smartoffice}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

smartoffice:
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:smartoffice-backend}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    qos: 1
    reconnect-delay-ms: 5000
    auto-register-unknown-devices: true
  rules:
    offline-timeout-seconds: 90
    offline-check-interval-ms: 15000
    command-timeout-seconds: 5
    door-command-timeout-seconds: 10
    command-max-retries: 2
    command-timeout-check-interval-ms: 2000
    sensor-fault-invalid-streak: 3
    sensor-fault-recover-streak: 3
    automation-check-interval-ms: 10000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.smartoffice: DEBUG
    org.eclipse.paho: INFO
    org.hibernate.SQL: INFO
