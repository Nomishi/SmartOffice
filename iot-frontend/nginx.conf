server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Nén gzip cho file tĩnh (file JS chính khoảng 1,7 MB, nén còn khoảng 0,5 MB). Không nén text/event-stream của SSE.
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Header bảo mật (giảm rủi ro XSS đánh cắp token: threat model TM-04).
  # 'unsafe-inline' ở style-src là do antd chèn CSS khi chạy. Nếu console trình duyệt báo CSP chặn tài nguyên nào,
  # sửa ở đây. Lưu ý: location nào có add_header riêng (như /assets/) sẽ không thừa kế các dòng này.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # DNS của Docker. Dùng biến bên dưới để Nginx vẫn khởi động được khi backend chưa chạy.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Chuyển /api sang backend Spring Boot (M3). Đổi tên service/cổng nếu khác.
  location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    # Cần cho SSE (realtime): không đệm, giữ kết nối lâu
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: mọi đường dẫn khác trả về index.html để React Router xử lý
  location / {
    try_files $uri /index.html;
  }
}
